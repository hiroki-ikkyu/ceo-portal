const fmtUpdated = (ts) => {
  if (!ts) return '';
  const d = new Date(typeof ts === 'number' ? ts * 1000 : ts);
  const parts = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const p = {};
  parts.forEach(({type,value}) => p[type] = value);
  return `${p.month}/${p.day} ${p.hour}:${p.minute}`;
};

const Spark = ({data,color,w=56,h=20}) => {
  const mi=Math.min(...data),mx=Math.max(...data),r=mx-mi||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mi)/r)*h}`).join(" ");
  return React.createElement("svg",{width:w,height:h,style:{display:"block"}},
    React.createElement("polyline",{points:pts,fill:"none",stroke:color,strokeWidth:"1.5",strokeLinecap:"round",strokeLinejoin:"round"})
  );
};

        <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#F0F0F0" strokeWidth="6" strokeLinecap="round"/>
        <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="url(#gg)" strokeWidth="6" strokeLinecap="round" strokeDasharray={`${(value/100)*126} 126`}/>
        <line x1="50" y1="50" x2="50" y2="16" stroke={color} strokeWidth="1.5" strokeLinecap="round" transform={`rotate(${angle} 50 50)`} style={{transition:"transform 1s cubic-bezier(0.34,1.56,0.64,1)"}}/>
        <circle cx="50" cy="50" r="3" fill={color}/>
      </svg>
      <div style={{position:"absolute",bottom:0,left:0,right:0,textAlign:"center"}}><span style={{fontSize:13,fontWeight:700,fontFamily:mn,color}}>{value}</span></div>
    </div>
  );
};

const SentimentExpandChart = ({data,label}) => {
  const [period,setPeriod] = useState('1Y');
  const gc = v=>v<=25?"#FF3B30":v<=45?"#FF9500":v<=55?"#FFD60A":v<=75?"#8CC63F":"#34C759";
  const history = data.history||[];
  const now = Date.now();
  const days = period==='6M'?182:period==='1Y'?365:730;
  const filtered = history.filter(d=>{
    const t = d.timestamp?d.timestamp*1000:(d.date?new Date(d.date).getTime():0);
    return t >= now - days*86400000;
  });
  const n = filtered.length;
  const W = 364, H = 100;
  const gx = i => n<=1?W/2:(i/(n-1))*W;
  const gy = v => H-v;
  const pts = n?filtered.map((d,i)=>`${gx(i).toFixed(1)},${gy(d.value).toFixed(1)}`).join(' '):'';
  const last = n?filtered[n-1]:null;
  const interval = period==='2Y'?3:period==='1Y'?2:1;
  const mLabels = [];
  if(n>1){
    let lastMo=-1,cnt=0;
    filtered.forEach((d,i)=>{
      const t = d.timestamp?d.timestamp*1000:(d.date?new Date(d.date).getTime():0);
      const mo = new Date(t).getMonth();
      if(mo!==lastMo){
        if(cnt%interval===0) mLabels.push({x:gx(i),text:new Date(t).toLocaleDateString('en-US',{month:'short'})});
        lastMo=mo;cnt++;
      }
    });
  }
  return (
    <div style={{background:'#fff',borderRadius:12,border:'1px solid #EDEDED',padding:'10px 12px',marginTop:6,animation:'fadeInChart 0.3s ease',overflow:'hidden'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <div style={{fontSize:9,color:'#AAA',fontFamily:mn,textTransform:'uppercase',letterSpacing:1}}>{label}</div>
        <div style={{display:'flex',gap:3}}>
          {['6M','1Y','2Y'].map(p=>(
            <button key={p} onClick={()=>setPeriod(p)} style={{padding:'2px 8px',borderRadius:4,border:'none',cursor:'pointer',fontSize:9,fontWeight:600,fontFamily:mn,background:period===p?'#1A1A1A':'#F0EFED',color:period===p?'#fff':'#BBB',WebkitTapHighlightColor:'transparent'}}>{p}</button>
          ))}
        </div>
      </div>
      {!n&&<div style={{fontSize:10,color:'#CCC',fontFamily:mn,padding:'16px 0',textAlign:'center'}}>No data</div>}
      {n>0&&(
        <svg width="100%" height="120" viewBox={`0 0 ${W} 114`} preserveAspectRatio="none" style={{display:'block'}}>
          <rect x="0" y="0" width={W} height="25" fill="#34C759" opacity="0.08"/>
          <rect x="0" y="75" width={W} height="25" fill="#FF3B30" opacity="0.08"/>
          <line x1="0" y1="25" x2={W} y2="25" stroke="#E8E8E8" strokeWidth="0.15"/>
          <line x1="0" y1="50" x2={W} y2="50" stroke="#E8E8E8" strokeWidth="0.15"/>
          <line x1="0" y1="75" x2={W} y2="75" stroke="#E8E8E8" strokeWidth="0.15"/>
          <polyline points={pts} fill="none" stroke="#888" strokeWidth="0.4" strokeLinejoin="round" strokeLinecap="round"/>
          {last&&<circle cx={gx(n-1).toFixed(1)} cy={gy(last.value).toFixed(1)} r="1.2" fill={gc(last.value)}/>}
          {mLabels.map((ml,i)=>(
            <text key={i} x={ml.x.toFixed(1)} y="112" fontSize="8" fill="#AAA" textAnchor="middle" fontFamily="JetBrains Mono,monospace">{ml.text}</text>
          ))}
        </svg>
      )}
    </div>
  );
};

const CEOPage = () => {
  const [summary, setSummary] = useState(null);

  useEffect(()=>{
    const refresh = () => {
      if (typeof SharedStore !== 'undefined') setSummary(SharedStore.getTodaySummary());
    };
    refresh();
    window.addEventListener('storage', refresh);
    return () => window.removeEventListener('storage', refresh);
  }, []);

  // サマリーテキストを返す。連携なしのアプリは null
  const getAppSummary = (id) => {
    const noData = {text:'未記録', color:'#AEAEB2', dim:true};
    if (id === 'kakeibo') {
      if (!summary?.expense) return noData;
      const spent = summary.expense.budget - summary.expense.remaining;
      return {text:`¥${spent.toLocaleString()} / ¥${summary.expense.budget.toLocaleString()}`, color: summary.expense.remaining >= 0 ? '#34C759' : '#FF3B30'};
    }
    if (id === 'routine-tracker') {
      if (!summary?.routine) return noData;
      return {text:`${summary.routine.completed}/${summary.routine.total} 完了 ${summary.routine.rate}%`, color:'#FF9500'};
    }
    if (id === 'study-tracker') {
      if (!summary?.study) return noData;
      const t = summary.study.lastSubject
        ? `${summary.study.minutes}分 · ${summary.study.lastSubject}`
        : `${summary.study.minutes}分`;
      return {text:t, color:'#5856D6'};
    }
    if (id === 'goal-manager') {
      const gs = typeof SharedStore !== 'undefined'
        ? SharedStore._utils.safeGet('shared:goals:summary') : null;
      if (!gs) return noData;
      return {
        text: `${gs.activeGoals}件進行中 · ${gs.overallProgress}%`,
        sub: gs.checkedInToday ? '✓ チェックイン済' : '未チェックイン',
        subColor: gs.checkedInToday ? '#34C759' : '#AEAEB2',
        color: '#FF3B30'
      };
    }
    return null; // wardrobe-manager は将来連携
  };

  // ゲーミフィケーション スコア
  const scoreItems = [
    {label:'予算内',     done: !!summary?.expense?.withinBudget,        color:'#34C759'},
    {label:'勉強30分',   done: (summary?.study?.minutes || 0) >= 30,    color:'#5856D6'},
    {label:'ルーティン', done: (summary?.routine?.rate || 0) >= 80,     color:'#FF9500'},
  ];
  const score = scoreItems.filter(s => s.done).length;

  return (
    <div style={{padding:"0 16px 48px"}}>

      {/* ── スコアバナー ── */}
      <div style={{marginTop:18,background:"#fff",borderRadius:16,padding:"16px",border:"1px solid #EDEDED"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:600,color:"#6E6E73",fontFamily:mn,letterSpacing:1.2,textTransform:"uppercase"}}>Today's Score</div>
          <div style={{fontSize:22,fontWeight:700,fontFamily:mn,color:"#1D1D1F"}}>
            {score}<span style={{fontSize:13,color:"#AEAEB2",fontWeight:400}}>/3</span>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          {scoreItems.map((item,i) => (
            <div key={i} style={{
              flex:1, borderRadius:10, padding:"9px 4px",
              background: item.done ? `${item.color}12` : "#F5F5F7",
              border: `1px solid ${item.done ? item.color+'30' : '#EDEDED'}`,
              textAlign:"center"
            }}>
              <div style={{fontSize:14, lineHeight:1}}>{item.done ? '✓' : '·'}</div>
              <div style={{
                fontSize:9, marginTop:3, fontFamily:mn, letterSpacing:0.2, fontWeight: item.done ? 600 : 400,
                color: item.done ? item.color : '#AEAEB2'
              }}>{item.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── アプリ一覧 ── */}
      <Section title="My Apps" topGap={20}>
        {FIXED_APPS.map((app, i) => {
          const sumData = getAppSummary(app.id);
          return (
            <div key={app.id} style={{marginBottom:8, animation:`fadeIn 0.3s ease ${i*0.06}s both`}}>
              <button
                onClick={()=>window.open(app.url, "_blank")}
                style={{
                  display:"flex", alignItems:"center", gap:14,
                  background:"#fff", borderRadius:16, padding:"14px 16px",
                  border:"1px solid #EDEDED", cursor:"pointer",
                  width:"100%", textAlign:"left", outline:"none",
                  WebkitTapHighlightColor:"transparent"
                }}
              >
                {/* アイコン */}
                <div style={{
                  width:48, height:48, borderRadius:14,
                  background:`${app.color}12`,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:22, flexShrink:0
                }}>{app.icon}</div>

                {/* テキスト */}
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:15, fontWeight:600, color:"#1D1D1F", fontFamily:sn}}>{app.name}</div>
                  {sumData && (
                    <>
                      <div style={{
                        fontSize:12, marginTop:3, fontFamily:mn,
                        color: sumData.dim ? '#AEAEB2' : sumData.color,
                        fontWeight: sumData.dim ? 400 : 600,
                      }}>{sumData.text}</div>
                      {sumData.sub && (
                        <div style={{fontSize:11, marginTop:1, fontFamily:mn, color: sumData.subColor||'#AEAEB2'}}>{sumData.sub}</div>
                      )}
                    </>
                  )}
                  {!sumData && (
                    <div style={{fontSize:11, marginTop:3, color:"#AEAEB2", fontFamily:mn}}>将来連携</div>
                  )}
                </div>

                {/* シェブロン */}
                <div style={{color:"#AEAEB2", fontSize:18, flexShrink:0, lineHeight:1}}>›</div>
              </button>
            </div>
          );
        })}
      </Section>
    </div>
  );
};

                    <div style={{fontSize:16,fontWeight:700,fontFamily:mn}}>{F.metrics.beta}</div>
                  </div>
                  <div style={{flex:1,background:"#F5F5F3",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                    <div style={{fontSize:9,color:"#888",fontFamily:mn,fontWeight:600}}>EXPOSURE</div>
                    <div style={{fontSize:16,fontWeight:700,fontFamily:mn}}>{F.metrics.grossExp}%</div>
                  </div>
                </div>
              )}
              <div style={{display:"flex",gap:4,marginBottom:10}}>
                {[["weight","Wt"],["pnl","P&L"],["chg","1D"],["upside","Upside"]].map(([k,l])=>(
                  <button key={k} onClick={()=>setPortSort(k)} style={{padding:"4px 8px",borderRadius:6,border:"none",fontSize:10,fontWeight:600,fontFamily:mn,background:portSort===k?"#1A1A1A":"#F0EFED",color:portSort===k?"#fff":"#999",cursor:"pointer",transition:"all 0.15s"}}>{l}</button>
                ))}
              </div>
              {sorted.map((p,i)=>(
                <div key={p.ticker+"-"+p.side} style={{background:"#fff",borderRadius:12,padding:"11px 13px",border:"1px solid #EDEDED",marginBottom:6,display:"flex",alignItems:"center",gap:10,animation:`fadeIn 0.25s ease ${i*0.03}s both`,borderLeft:(fund==="LS"||fund==="MN")?`3px solid ${p.side==="L"?"#34C759":"#FF3B30"}`:"none"}}>
                  <div style={{width:36,height:36,borderRadius:8,background:p.side==="S"?"#FF3B3012":p.rating==="OW"?"#34C75912":"#F5F5F3",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,flexDirection:"column",gap:0}}>
                    {(fund==="LS"||fund==="MN")&&<span style={{fontSize:8,fontWeight:700,fontFamily:mn,color:p.side==="L"?"#34C759":"#FF3B30"}}>{p.side}</span>}
                    <span style={{fontSize:10,fontWeight:700,fontFamily:mn,color:p.rating==="OW"?"#34C759":p.rating==="UW"?"#FF3B30":"#999"}}>{p.rating}</span>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                    <div style={{fontSize:10,color:"#BBB",fontFamily:mn}}>{p.ticker} · {p.sector} · {Math.abs(p.weight)}%{fund==="HD"&&p.divYld?" · "+p.divYld+"%yld":""}</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:13,fontWeight:600,fontFamily:mn}}>{p.chg>=0?"+":""}{p.chg}%</div>
                    <div style={{fontSize:10,fontFamily:mn,color:p.upside>=0?"#34C759":"#FF3B30"}}>TP {p.upside>=0?"+":""}{p.upside}%</div>
                  </div>
                </div>
              ))}
            </Section>

            <Section title="Sector Exposure">
              {(()=>{const sec={};pos.forEach(p=>{const k=p.sector;if(!sec[k])sec[k]={long:0,short:0};if(p.side==="L")sec[k].long+=p.weight;else sec[k].short+=Math.abs(p.weight)});const mx=Math.max(...Object.values(sec).map(v=>v.long+v.short));return Object.entries(sec).sort((a,b)=>(b[1].long+b[1].short)-(a[1].long+a[1].short)).map(([s,v])=>(
                <div key={s} style={{marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:55,fontSize:11,fontWeight:500,color:"#888",flexShrink:0}}>{s}</div>
                    <div style={{flex:1,height:20,background:"#F5F5F3",borderRadius:6,overflow:"hidden",display:"flex"}}>
                      {v.long>0&&<div style={{height:"100%",width:`${(v.long/mx)*100}%`,background:"linear-gradient(90deg,#1A1A1A,#444)",borderRadius:"6px 0 0 6px",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:4}}>
                        <span style={{fontSize:9,fontWeight:600,fontFamily:mn,color:"#fff"}}>{v.long.toFixed(1)}</span>
                      </div>}
                      {v.short>0&&<div style={{height:"100%",width:`${(v.short/mx)*100}%`,background:"linear-gradient(90deg,#FF3B3080,#FF3B30)",borderRadius:"0 6px 6px 0",display:"flex",alignItems:"center",justifyContent:"flex-start",paddingLeft:4}}>
                        <span style={{fontSize:9,fontWeight:600,fontFamily:mn,color:"#fff"}}>-{v.short.toFixed(1)}</span>
                      </div>}
                    </div>
                  </div>
                </div>
              ))})()}
            </Section>
          </React.Fragment>}

          {view==="deep" && <React.Fragment>
            <Section title="Spread Monitor" topGap={18}>
              {SPREADS.map((s,i)=>(
                <div key={i} style={{background:"#fff",borderRadius:12,padding:"12px 14px",border:"1px solid #EDEDED",marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:13,fontWeight:600}}>{s.name}</span>
                    <Pill color={s.trend==="expanding"?"#34C759":"#FF3B30"}>{s.trend}</Pill>
                  </div>
                  <div style={{display:"flex",gap:20,marginTop:8}}>
                    <div><div style={{fontSize:9,color:"#BBB",fontFamily:mn}}>Current</div><div style={{fontSize:18,fontWeight:700,fontFamily:mn}}>{s.current.toLocaleString()}</div></div>
                    <div><div style={{fontSize:9,color:"#BBB",fontFamily:mn}}>1Y Avg</div><div style={{fontSize:18,fontWeight:500,fontFamily:mn,color:"#999"}}>{s.avg.toLocaleString()}</div></div>
                    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
                      <div style={{fontSize:14,fontWeight:700,fontFamily:mn,color:s.current>s.avg?"#34C759":"#FF3B30"}}>{s.current>s.avg?"+":""}{((s.current-s.avg)/s.avg*100).toFixed(1)}%</div>
                    </div>
                  </div>
                </div>
              ))}
            </Section>
            <Section title="Macro Pulse">
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                {MACRO.map((m,i)=>(
                  <div key={i} style={{background:"#fff",borderRadius:10,padding:"10px 12px",border:"1px solid #EDEDED"}}>
                    <div style={{fontSize:10,color:"#999",fontWeight:500,marginBottom:4}}>{m.name}</div>
                    <div style={{display:"flex",alignItems:"baseline",gap:6}}>
                      <span style={{fontSize:16,fontWeight:700,fontFamily:mn,color:m.signal==="up"?"#34C759":"#FF3B30"}}>{m.value}</span>
                      <span style={{fontSize:10,color:"#CCC",fontFamily:mn}}>← {m.prev}</span>
                    </div>
                  </div>
                ))}
              </div>
            </Section>
            <Section title="Research Notes">
              <div style={{display:"flex",gap:8,marginBottom:10}}>
                <input value={noteText} onChange={e=>setNoteText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addNote()} placeholder="メモを追加..." style={{flex:1,padding:"10px 14px",borderRadius:10,border:"1px solid #E8E8E8",fontSize:13,fontFamily:sn,outline:"none",background:"#fff"}}/>
                <button onClick={addNote} style={{width:42,borderRadius:10,border:"none",background:"#1A1A1A",color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer"}}>+</button>
              </div>
              {notes.map((n,i)=>(
                <div key={n.id} style={{background:"#fff",borderRadius:12,padding:"11px 13px",border:"1px solid #EDEDED",marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:10,color:"#BBB",fontFamily:mn}}>{n.date}</span>
                    {n.ticker&&<Pill>{n.ticker}</Pill>}
                  </div>
                  <div style={{fontSize:12,lineHeight:1.5,color:"#444"}}>{n.text}</div>
                </div>
              ))}
            </Section>
          </React.Fragment>}
        </div>
      </React.Fragment>}

      {/* BOTTOM */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(250,250,248,0.9)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderTop:"1px solid #E8E8E8",padding:"8px 20px 24px",display:"flex",justifyContent:"center"}}>
        <div style={{fontSize:9,color:"#CCC",fontFamily:mn,letterSpacing:0.5}}>MATERIALS RESEARCH PORTAL · DUMMY DATA</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
